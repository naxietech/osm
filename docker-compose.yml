# Local development infrastructure for OSES.
# Brings up a dedicated PostgreSQL for apps/api. Isolated from any other local
# Postgres — known credentials, its own volume, and host port 5433 so it can sit
# alongside another project's Postgres already using the default 5432.
#
# Dev only. Production uses managed PostgreSQL (RDS) for backups + PITR (NFR-REL-4)
# and HA across exam cycles (NFR-AV-1) — do not run this container in production.
#
#   docker compose up -d        # start Postgres
#   docker compose down         # stop (keeps data)
#   docker compose down -v      # stop and wipe data
#
# The connection strings these settings produce (put in apps/api/.env):
#   DATABASE_URL=postgres://oses:oses_dev_pw@localhost:5433/oses_dev
#   DATABASE_URL_TEST=postgres://oses:oses_dev_pw@localhost:5433/oses_test
services:
  postgres:
    image: postgres:16-alpine
    container_name: oses-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: oses
      POSTGRES_PASSWORD: oses_dev_pw
      POSTGRES_DB: oses_dev
    ports:
      # host 5433 → container 5432. Postgres inside the container always listens on
      # 5432; publishing on 5433 leaves the default free for another project's Postgres.
      - '5433:5432'
    volumes:
      - oses-pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U oses -d oses_dev']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  oses-pgdata:
