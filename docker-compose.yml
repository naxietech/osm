# Local development infrastructure for OSES.
# Brings up a dedicated PostgreSQL for apps/api. Isolated from any other local
# Postgres — known credentials, its own volume, standard port 5432.
#
#   docker compose up -d        # start Postgres
#   docker compose down         # stop (keeps data)
#   docker compose down -v      # stop and wipe data
#
# The connection string these settings produce (put in apps/api/.env):
#   DATABASE_URL=postgres://oses:oses_dev_pw@localhost:5432/oses_dev
services:
  postgres:
    image: postgres:16-alpine
    container_name: oses-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: oses
      POSTGRES_PASSWORD: oses_dev_pw
      POSTGRES_DB: oses_dev
    ports:
      - '5432:5432'
    volumes:
      - oses-pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U oses -d oses_dev']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  oses-pgdata:
